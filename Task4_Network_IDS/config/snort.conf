#========================================================================
# snort.conf - minimal Snort 2.9 configuration for the CodeAlpha NIDS task
#
# This is a trimmed, self-contained config for testing the custom rule
# set. It is NOT a full production snort.conf. On a real install you
# would normally edit /etc/snort/snort.conf instead and just add:
#     include $RULE_PATH/codealpha_ids.rules
#========================================================================

# Networks to protect and what counts as "outside"
var HOME_NET [192.168.1.0/24]
var EXTERNAL_NET !$HOME_NET

# Where the rules live
var RULE_PATH ../rules

# Alert output: fast, human-readable, one line per alert
output alert_fast: alerts.log

# Where Snort writes logs when run with -l
config logdir: /var/log/snort

# Normalise traffic before matching
preprocessor frag3_global: max_frags 65536
preprocessor frag3_engine: policy linux detect_anomalies
preprocessor stream5_global: track_tcp yes
preprocessor stream5_tcp: policy linux

# Classtype definitions used by the rules
include classification.config

# The custom rules for this task
include $RULE_PATH/codealpha_ids.rules
